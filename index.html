<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1b" />
    <meta name="description" content="AstroPath — теория, симуляторы и задачи для подготовки к олимпиадам по астрономии." />
    <title>AstroPath — Олимпиадная астрономия</title>
    <script>
      window.MathJax = {
        tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']]},
        options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']},
        svg: {fontCache: 'local'},
        startup: {pageReady: () => MathJax.startup.defaultPageReady().then(() => window.dispatchEvent(new Event('mathjax-ready')))}
      };
    </script>
    <script defer src="/vendor/mathjax.bundle.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
